# Host nginx server block for the http.nyc AI apps. Same shape as
# wedding-planning's: drop into the Pi's nginx sites config, reload nginx,
# then let certbot add the TLS listener the way it did for the other sites:
#
#   sudo certbot --nginx -d http.nyc -d calc.http.nyc -d date.http.nyc -d time.http.nyc -d json.http.nyc
#
# (Or, if the Pi already has a wildcard *.http.nyc cert, add the ssl listener
# by hand pointing at it.) DNS must already resolve every name below.
#
# The container publishes 127.0.0.1:3010 (see docker-compose.yml).
# The app picks which sub-app to serve from the Host header, so passing it
# through is required, not cosmetic.

server {
    listen 80;
    server_name http.nyc calc.http.nyc date.http.nyc time.http.nyc json.http.nyc;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
