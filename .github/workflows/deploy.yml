name: Deploy

# Sends a deploy event to FrenchCommando/pi-deploy, whose self-hosted runner on
# the Pi pulls this repo's clone and rebuilds the container. See that repo's
# README. Needs the PI_DEPLOY_TOKEN secret (fine-grained PAT, pi-deploy only).
on:
  push:
    branches: [master]

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to pi-deploy
        env:
          GH_TOKEN: ${{ secrets.PI_DEPLOY_TOKEN }}
        run: >
          gh api repos/FrenchCommando/pi-deploy/dispatches
          -f event_type=deploy
          -f 'client_payload[app]=calculator-ai'
          -f "client_payload[sha]=${GITHUB_SHA}"
